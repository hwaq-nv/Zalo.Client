name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libasound2-dev libclang-dev

      - uses: ilammy/setup-nasm@v1
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - run: bun install --frozen-lockfile && cd server && bun install --frozen-lockfile
      - run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
